# ─────────────────────────────────────────────────────────────────────────────
#  Pipeline de PRODUCCIÓN: lo que se mergea a `main` se publica en el canal
#  `live` de Firebase Hosting.
#
#  Buscá los comentarios "TODO A?" y completalos según el enunciado.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy a producción

# [A1 ✔] Trigger: corre en cada push a la rama `main`.
on:
  push:
    branches:
      - main

permissions:
  contents: read

# [A4 ✔ opcional] Los deploys esperan en fila y nunca se cortan a la mitad
#                 (cancel-in-progress: false = no cancela, encola).
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # [A5 ✔ opcional] Job asociado al Environment `production`
    #                 (permite exigir aprobación manual).
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # [A2 ✔] Trazabilidad: SHA del commit en main y nombre de la rama.
      - name: Build (export estático)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_REF: ${{ github.ref_name }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Deploy al canal live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # [A3 ✔] Mismo secreto que en el workflow de PR.
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FIR_HOSTING_TP_EB401 }}
          projectId: fir-hosting-tp-eb401
          # [A3 ✔] `live` publica en el canal de producción.
          channelId: live