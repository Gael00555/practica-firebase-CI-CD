# ─────────────────────────────────────────────────────────────────────────────
#  Pipeline de PREVIEW: cada Pull Request se despliega en un "preview channel"
#  de Firebase Hosting (URL propia, temporal, aislada de producción).
#
#  Buscá los comentarios "TODO A?" y completalos según el enunciado.
#  Mientras el trigger sea solo `workflow_dispatch`, el workflow NO corre solo.
# ─────────────────────────────────────────────────────────────────────────────
name: Preview en Pull Request

# [A1 ✔] Trigger: corre en cada Pull Request.
on: pull_request

permissions:
  contents: read
  checks: write
  pull-requests: write # la action comenta la URL del preview en el PR

# [A4 ✔ opcional] Si se pushea dos veces seguidas al mismo PR,
#                 se cancela el build anterior.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # [A2 ✔] Trazabilidad: SHA del último commit del PR y nombre de la rama.
      #        (En un PR, github.sha sería un commit de merge temporal,
      #         por eso se usa pull_request.head.sha.)
      - name: Build (export estático)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          NEXT_PUBLIC_BUILD_REF: ${{ github.head_ref }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.pull_request.updated_at }}

      - name: Deploy a preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # [A3 ✔] Nombre exacto del secreto creado por firebase init
          #        (ojo: lleva "secrets." delante).
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FIR_HOSTING_TP_EB401 }}
          projectId: fir-hosting-tp-eb401
          # [A3 ✔] El preview vence a los 3 días.
          expires: 3d